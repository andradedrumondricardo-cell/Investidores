                  content: '<h2 class="default-heading2">Olá{% if contact.NOME %}, {{ contact.NOME }}{% endif %}!</h2><p style="font-size:20px;"><strong>Newsletter Energia &amp; Capital · Edição nº 1</strong></p>'
