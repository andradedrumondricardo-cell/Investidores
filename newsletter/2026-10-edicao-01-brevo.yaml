                  content: '<p><span style="font-size:12px;color:#8A6D00;"><strong>CONTA DE LUZ</strong></span><br><strong><a href="https://energiaecapital.com.br/artigos/tarifa-branca/" style="color:#0E1B17;font-size:18px;">Tarifa branca: quando compensa mudar o horário de consumo</a></strong><br><span style="color:#555555;">Mesma energia, contas diferentes: na tarifa branca, o preço muda conforme a hora do dia. Duas casas, o mesmo consumo e um teste rápido para saber se vale a pena para você.</span></p><p><span style="font-size:12px;color:#8A6D00;"><strong>INVESTIDOR</strong></span><br><strong><a href="https://energiaecapital.com.br/artigos/scp-sociedade-em-conta-de-participacao/" style="color:#0E1B17;font-size:18px;">SCP: o sócio da vitrine e os sócios dos bastidores</a></strong><br><span style="color:#555555;">O modelo da construção civil chegou à energia solar. Como funciona, o que acontece se o sócio ostensivo quebrar e quando a oferta vira assunto da CVM.</span></p><p><span style="font-size:12px;color:#8A6D00;"><strong>INVESTIDOR</strong></span><br><strong><a href="https://energiaecapital.com.br/artigos/debentures-incentivadas/" style="color:#0E1B17;font-size:18px;">Debêntures incentivadas: emprestar para a infraestrutura</a></strong><br><span style="color:#555555;">A isenção de imposto, a gangorra dos juros e os riscos que pouca gente comenta.</span></p><p><span style="font-size:12px;color:#8A6D00;"><strong>IA E ENERGIA</strong></span><br><strong><a href="https://energiaecapital.com.br/artigos/ia-datacenters-energia/" style="color:#0E1B17;font-size:18px;">O atalho elétrico da inteligência artificial</a></strong><br><span style="color:#555555;">A corrida da IA virou corrida por megawatts conectados. No Brasil, falta rede onde está a demanda e sobra energia onde está a geração.</span></p><p><strong>Sigla estranha na conta de luz?</strong> Nosso <a href="https://energiaecapital.com.br/artigos/glossario-da-energia/" style="color:#0E1B17;"><strong>glossário com 42 termos</strong></a> explica cada uma.</p>'
