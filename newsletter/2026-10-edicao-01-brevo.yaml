                  content: '<p>Esta é a primeira edição da newsletter da Energia &amp; Capital. A cada 15 dias, o essencial do setor de energia, explicado sem complicação: como a energia é gerada, contratada e regulada, e o que isso muda para consumidores, empresas e investidores.</p><p>Nesta quinzena:</p>'
