<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>linkedin</title>
<style>
body{margin:0;font-family:'Archivo','DejaVu Sans',sans-serif}
#capa{width:1128px;height:191px;background:#0E1B17;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 56px 0 300px;box-sizing:border-box;position:relative;overflow:hidden}
#capa .faixa{position:absolute;left:0;top:0;bottom:0;width:10px;background:#F5C400}
#capa h1{margin:0;font-size:32px;font-weight:900;line-height:1.05;letter-spacing:-.5px}
#capa h1 span{color:#F5C400}
#capa p{margin:8px 0 0;font-size:17px;color:#C9D3CE}
#capa .url{font-size:16px;font-weight:700;color:#0E1B17;background:#F5C400;padding:8px 14px;border-radius:6px;white-space:nowrap}
#capa svg.sol{position:absolute;right:-60px;top:-80px;opacity:.08}
#perfil{width:400px;height:400px}
#post{width:1200px;height:627px;background:#0E1B17;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box;gap:22px}
#post .kicker{font-size:22px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#F5C400}
#post h2{margin:0;font-size:60px;line-height:1.05;font-weight:900;max-width:950px}
#post .marca{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:900;margin-top:10px}
</style></head>
<body>
<div id="capa">
  <div class="faixa"></div>
  <svg class="sol" width="360" height="360" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#F5C400"/></svg>
  <div>
    <h1>Energia como classe de ativo<span>.</span></h1>
    <p>Notícias, guias e análises sobre o setor elétrico brasileiro</p>
  </div>
  <div class="url">energiaecapital.com.br</div>
</div>
<svg id="perfil" viewBox="0 0 64 64"><rect width="64" height="64" fill="#0E1B17"/><circle cx="32" cy="32" r="19" fill="#F5C400"/><path d="M36 9 L21 36 H31 L27 55 L44 26 H34 Z" fill="#0E1B17"/></svg>
<div id="post">
  <div class="kicker">Energia &amp; Capital · Novo artigo</div>
  <h2>O atalho elétrico da inteligência artificial: o MW parado que o Brasil ainda não usa</h2>
  <div class="marca"><svg width="48" height="48" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#F5C400"/><circle cx="32" cy="32" r="19" fill="#0E1B17"/><path d="M36 9 L21 36 H31 L27 55 L44 26 H34 Z" fill="#F5C400"/></svg>energiaecapital.com.br</div>
</div>
</body></html>
