<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>marca</title>
<style>
body{margin:0;font-family:'Archivo','DejaVu Sans',sans-serif}

</style></head>
<body>
<div id="og">

  <div class="faixa"></div>
  <p>Notícias, guias e análises sobre energia no Brasil</p>
</div>
<svg id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1B17"/><circle cx="32" cy="32" r="19" fill="#F5C400"/><path d="M36 9 L21 36 H31 L27 55 L44 26 H34 Z" fill="#0E1B17"/></svg>
</body></html>
